<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teleprompter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark light">

<!-- PWA / iOS -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/parse.js"></script>
<script src="js/app.js"></script>
<script src="js/prompter.js"></script>
<script>
  // Service worker: apenas em http/https (não em file://)
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || ['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('SW não registrado:', e);
      });
    });
  }
  // Armazenamento persistente (evita que o iOS/Safari apague os roteiros)
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (p) { if (!p) navigator.storage.persist(); });
  }
  // Inicia o app
  window.addEventListener('DOMContentLoaded', function () { App.start(); });
</script>
</body>
</html>
